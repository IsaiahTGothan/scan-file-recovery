[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeboat-recovery"
description = "Lifeboat Data Recovery: get your files off a failing drive."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Zays" }]
dependencies = ["PySide6-Essentials>=6.7"]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout", "ruff", "mypy", "pyinstaller>=6.10"]

[project.scripts]
lifeboat-cli = "lifeboat.cli:main"

[project.gui-scripts]
lifeboat = "lifeboat.ui.app:main"

[tool.setuptools.dynamic]
version = { attr = "lifeboat.__version__" }

[tool.setuptools.packages.find]
include = ["lifeboat*"]

[tool.setuptools.package-data]
lifeboat = ["assets/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/.images"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "PL"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLR0402",
    "PLW0603", "PLC0415", "SIM102", "SIM108", "RUF001", "RUF002", "RUF003",
    "B008", "PLW2901", "PLR1714", "SIM105", "RUF012", "PLR0917", "B027", "RUF023",
    "RUF046", "PLR1730", "PLW1510", "PLW0108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR", "B", "SIM", "RUF", "BLE"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = ["tests/", "build/", "dist/"]

[[tool.mypy.overrides]]
module = ["lifeboat.device.windows", "lifeboat.recover.winapi"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
addopts = "-ra"
