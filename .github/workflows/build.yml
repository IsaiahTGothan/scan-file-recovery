name: Build and test

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux - lint, types, full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Filesystem tools for the reference disk images
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ntfs-3g attr dosfstools mtools exfatprogs exfat-fuse fdisk gdisk ffmpeg \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pillow
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy lifeboat
      - name: Tests (root is needed to mount the reference images)
        env:
          LIFEBOAT_REQUIRE_IMAGES: "1"
          QT_QPA_PLATFORM: offscreen
        run: sudo -E env "PATH=$PATH" "$(which python)" -m pytest -q

  windows:
    name: Windows - tests, real-disk end-to-end, build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pillow
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Create a real NTFS test disk (VHDX)
        run: python tests/windows/vhd_e2e.py create
      - name: Recover from the raw disk with the Python package
        run: python tests/windows/vhd_e2e.py verify-api
      - name: Build Lifeboat.exe and lifeboat-cli.exe
        run: |
          python packaging/make_icon.py
          pyinstaller packaging/lifeboat.spec --noconfirm --distpath dist --workpath build/pyi
      - name: Smoke test the packaged desktop app
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\Lifeboat\Lifeboat.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          Write-Host "Lifeboat.exe exit code: $($p.ExitCode)"
          Get-Content "$env:LOCALAPPDATA\Lifeboat\logs\lifeboat.log" -Tail 20
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Select-String -Path "$env:LOCALAPPDATA\Lifeboat\logs\lifeboat.log" -Pattern "Smoke test finished")) { exit 1 }
      - name: Recover from the raw disk with the packaged lifeboat-cli.exe
        run: python tests/windows/vhd_e2e.py verify-cli dist\Lifeboat\lifeboat-cli.exe
      - name: Remove the test disk
        if: always()
        run: python tests/windows/vhd_e2e.py destroy
      - name: Installer and portable zip
        shell: pwsh
        run: |
          $version = python -c "import lifeboat; print(lifeboat.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path dist\Lifeboat -DestinationPath "dist\Lifeboat-$version-portable.zip"
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Lifeboat-Windows
          path: |
            dist/Lifeboat-Setup-*.exe
            dist/Lifeboat-*-portable.zip
          if-no-files-found: error
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Lifeboat-Setup-*.exe
            dist/Lifeboat-*-portable.zip
